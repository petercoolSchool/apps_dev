<!DOCTYPE html>
<html>
<head>
<title>Apps Timer</title>
<style>
@property --timerPercentage{
	syntax: "<percentage>";
	inherits: true;
	initial-value: 100%;
}
#timerBorder{
	position: absolute;
	width: 200px;
	height: 200px;
	border-radius: 50%;
	background: conic-gradient(#25f452 var(--timerPercentage), #cccccc var(--timerPercentage));
	-webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
	mask-composite: exclude;
	padding: 10px;
	transition: --timerPercentage 0.15s linear;
}
#timer{
	background-color: lightgray;
	display: flex;
	justify-content: center;
	align-items: center;
	height: 220px;
	width: 220px;
	border-radius: 50%;
	transition: 0.5s background;
}
/*----------CAN REMOVE THE #TIMER STYLE BELOW WHEN ADDED TO SITE----------------*/
#timer{
	position: absolute;
	top: 50%;
	left: 50%;
	translate: -50% -50%;
}
#timer.done{
	animation: alarm 2s ease-in-out 0s infinite;
	background: red;
}
@keyframes alarm{
	0%{transform: scale(1);}
	50%{transform: scale(1.2);}
	100%{transform: scale(1);}
}
#timeLeft{
	font-size: 30px;
	margin-right: 15px;
}
.timeSet{
	height: 50px;
	width: 63px;
	text-align: center;
	font-size: 30px;
	border-radius: 10px;
	outline: none;
	border: none;
	background: transparent;
	transition: 0.5s background;
}
.timeSet::placeholder{
	color: black;
}
#startTimer{
	position: absolute;
	left: 50%;
	top: calc(50% + 150px);
	translate: -50% -50%;
	height: 40px;
	width: 200px;
	border-radius: 21px;
	border: none;
	cursor: pointer;
	background: #25f452e0;
	letter-spacing: 2px;
	font-size: 15px;
	transition: 0.5s background, 0.5s left, 0.5s width;
}
#startTimer.timerActive{
	background: #ffa500e0;
	width: 150px;
	left: calc(50% + 25px);
}
#restartTimer{
	width: 40px;
	height: 40px;
	position: absolute;
	left: calc(50% - 80px);
	top: calc(50% + 150px);
	translate: -50% -50%;
	border-radius: 21px;
	border: none;
	cursor: pointer;
	background: #ff0000e0;
	opacity: 0;
	pointer-events: none;
	transition: 0.5s left, 0.5s opacity;
}
#timeSets{
	position: absolute;
	left: 50%;
	transform: translate(-50%, 0px);
	width: 210px;
}
#mute{
	position: absolute;
	right: 0%;
	top: 0%;
	height: 30px;
	width: 30px;
	padding: 0;
	border-radius: 21px;
	overflow: hidden;
	background: none;
	border: 1px solid black;
	backdrop-filter: contrast(1.1);
	transition: scale 0.3s;
}
#mute > img{
	height: 26px;
	width: 26px;
}
#mute:active{
	scale: 1.1;
}
</style>
<script>
let timerInterval;
let timerOn;
let mute = false;
function startTimer(hr, min, sec){
	!hr ? hr=0:null
	!min ? min=0:null
	!sec ? sec=0:null
	let timeRemaining = hr * 3600 + min * 60 + sec;
	let startTime = timeRemaining;
	timerOn = true;	
	timerInterval = setInterval(()=>{
		if(timerOn){
			sec -= 0.1;
			timeRemaining -= 0.1;
			if(min == 0 && sec < 0 && hr > 0){hr -= 1; min += 60;}
			if(sec < 0 && min > 0){min -= 1; sec += 60;}
			let timerPercentage = timeRemaining/startTime * 100;
			document.getElementById('timerBorder').style.setProperty('--timerPercentage', timerPercentage + '%');
			document.getElementById('timeLeft').innerText = `${hr.toString().length > 1 ? hr : '0' + hr}:${min.toString().length > 1 ? min : '0' + min}:${Math.floor(sec).toString().length > 1 ? Math.floor(sec) : '0' + Math.floor(sec)}`;
			if(timeRemaining - 1 <= -1){
				clearInterval(timerInterval);
				timerAlarm();
			}
		}
	}, 100);
}
function timerAlarm(){
	document.getElementById('timeLeft').innerText = '';
	document.getElementById('timer').classList.add('done');
	hideTimeSet(false);
	let startTimerElm = document.getElementById('startTimer')
	startTimerElm.style.background = "#ff0000e0"
	startTimerElm.innerText = 'Stop';
	startTimerElm.setAttribute('onclick', 'stopTimer()')
	document.getElementById('restartTimer').style.opacity = '0';
	document.getElementById('restartTimer').style.setProperty('pointer-events', 'none');
	startTimerElm.style.width = '';
	startTimerElm.style.left = '';
	startTimerElm.classList.remove('timerActive')
	!mute ? generateSound(600, 'sine', 5) : null;
}
function startTimerClicked(){
	startTimer(parseInt(document.getElementById('hr').value), parseInt(document.getElementById('min').value), parseInt(document.getElementById('sec').value));
	hideTimeSet(true);
	let startTimerElm = document.getElementById('startTimer')
	startTimerElm.innerText = 'Pause';
	startTimerElm.classList.add('timerActive')
	startTimerElm.setAttribute('onclick', 'pauseTimer()');
	document.getElementById('restartTimer').style.opacity = '1';
	document.getElementById('restartTimer').style.setProperty('pointer-events', 'auto');
}
function stopTimer(){
	document.getElementById('timer').classList.remove('done');
	resetStartTimerElm();
	document.getElementById('timerBorder').style.setProperty('--timerPercentage', '100%');	
	if(!mute){osc[0].stop();}
	osc.splice(0, 1)
	filters.splice(0, 1)
	gain.splice(0, 1)
}
function pauseTimer(){
	timerOn = false;
	document.getElementById('startTimer').innerText = 'Resume'
	document.getElementById('startTimer').setAttribute('onclick', 'resumeTimer()');
}
function resumeTimer(){
	timerOn = true;
	document.getElementById('startTimer').innerText = 'Pause'
	document.getElementById('startTimer').setAttribute('onclick', 'pauseTimer()');
}
function hideTimeSet(doit){
	document.getElementById('timeSets').hidden = doit
}
function restartTimer(){
	resetStartTimerElm()
	document.getElementById('timerBorder').style.setProperty('--timerPercentage', '100%');
	clearInterval(timerInterval);
	document.getElementById('restartTimer').style.opacity = '0';
	document.getElementById('restartTimer').style.setProperty('pointer-events', 'none');
	hideTimeSet(false);
	document.getElementById('timeLeft').innerText = '';
}
function resetStartTimerElm(){
	let startTimerElm = document.getElementById('startTimer')
	startTimerElm.style.background = ""
	startTimerElm.innerText = 'Start';
	startTimerElm.setAttribute('onclick', 'startTimerClicked()')
	startTimerElm.style.width = '';
	startTimerElm.style.left = '';
	startTimerElm.classList.remove('timerActive')
}
