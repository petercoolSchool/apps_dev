<!DOCTYPE html>
<html>
<head>
<style>
@keyframes load{
	0%{transform: scale(1);}
	50%{transform: scale(1.2);}
	100%{transform: scale(1);}
}
@keyframes loadImage{
	0%{left: 50%;}
	100%{left: 35%;}
}
@keyframes loadText{
	0%{transform: scale(1);}
	100%{transform: scale(2); left: 65%;}
}
@keyframes hueRotate{
	0%{filter: hue-rotate(0deg);}
	100%{filter: hue-rotate(360deg);}
}
#load_logo{
	translate: -50% -50%;
	transform-origin: center;
	animation: load 2s ease-in-out 0s 1 forwards, loadImage 1s ease-in-out 1s 1 forwards, hueRotate 2s ease-in-out 1s 1 forwards;
	box-shadow: none;
	position: fixed;
	left: 50%;
	top: 50%;
	height: 40%;
	aspect-ratio: 1 / 1;
}
#loading-case{
	overflow: hidden;
	height: 100vh;
	width: 100vw;
	z-index: 99;
	transform: translate(-50%, -50%);
	position: fixed;
	top: 50%;
	left: 50%;
	opacity: 1;
	backdrop-filter: blur(30px);
}
#loading-case > h1{
	background: linear-gradient(blue, green);
	background-clip: text;
	-webkit-background-clip: text;
	color: transparent;
	position: fixed;
	left: 50%;
	top: 50%;
	translate: -50% -50%;
	z-index: -1;
	animation: loadText 1s ease-in-out 1s 1 forwards, hueRotate 2s ease-in-out 1s 1 forwards;
}
.loadCollapse{
	left: 50% !important;
	transition: left 1s ease-in-out;
}
#loading-case.loadBackgroundFade{
	opacity: 0;
	pointer-events: none;
	transition: opacity 0.5s 0.5s ease-in-out;
}
</style>
<script>
let loadProgress = 0;
function checkIfLoaded(){
	if(loadProgress == 2){
		let text = document.getElementById('loadText');
		let logo = document.getElementById('load_logo');
		text.style.cssText = 'transform: scale(2); left: 65%;'
		logo.style.left = '35%';
		logo.style.animation = 'none';
		text.style.animation = 'none';
		void logo.offsetWidth;
		logo.classList.add('loadCollapse');
		text.classList.add('loadCollapse');
		text.style.left = '';
		logo.style.left = '';
		document.getElementById('loading-case').className = 'loadBackgroundFade'
		setTimeout(()=>{
			document.getElementById('loading-case').remove();
		}, 1000);
	}
}
document.addEventListener('DOMContentLoaded', ()=>{
	setTimeout(()=>{
		loadProgress ++;
		checkIfLoaded();
	}, 3000)
})
window.addEventListener('load', ()=>{
	console.log('load')
	loadProgress ++;
	checkIfLoaded();
})
</script>
</head>
